[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "posegate"
version = "0.1.0"
description = "Computational chemistry toolkit for docking pose analysis and triage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
dependencies = [
    "rdkit",
    "prolif",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "vina",
    "openmm",
    "pdbfixer",
    "requests",
]
# openbabel is also required (used via CLI in posegate.docking) but has no
# pip-installable Python wheel with the CLI bundled; install it via conda
# (see environment.yml) or your system package manager.

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["posegate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
